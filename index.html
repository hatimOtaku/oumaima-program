<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oumaima · Programme 12 semaines</title>
<meta name="description" content="Programme sport et alimentation pour Oumaima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--ink:#0b0b0c;--muted:#6b6b72;--line:#e8e6e1;--card:#fff;--a:#ff7a59;--b:#a66bff;--c:#3dd6c6;--dark:#0b0b0c;--ok:#18a367;--warn:#e5484d;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
section{padding:90px 0}
h2{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.02em;margin-bottom:14px}
h2 em,.hero h1 em{font-family:"Instrument Serif",serif;font-weight:400}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:2px;background:linear-gradient(90deg,var(--a),var(--b))}
.lead{color:var(--muted);font-size:18px;max-width:620px;margin-bottom:38px}
.mini{font-size:13.5px;color:var(--muted)}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s;color:#fff;overflow:hidden}
#intro.done{opacity:0;visibility:hidden}
#intro .glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));filter:blur(90px);opacity:.35;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{position:relative;display:flex;align-items:center;gap:5px;height:120px;margin-bottom:34px}
.wave i{display:block;width:5px;border-radius:5px;background:linear-gradient(#fff,#cfc3ff);height:8px;animation:bar 1.2s ease-in-out infinite}
@keyframes bar{0%,100%{height:8px;opacity:.5}50%{height:var(--h);opacity:1}}
#hello{position:relative;font-size:clamp(44px,9vw,104px);letter-spacing:-.03em;line-height:1;text-align:center;padding:0 16px;font-weight:700}
#hello span{display:inline-block;opacity:0;transform:translateY(24px);filter:blur(10px);animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}
#hello .name{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;background:linear-gradient(90deg,#ffb199,#c9a7ff,#8ff0e4);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes in{to{opacity:1;transform:none;filter:none}}
#skip{position:absolute;bottom:28px;border:1px solid #333;color:#aaa;border-radius:99px;padding:8px 18px;font-size:13px}
#skip:hover{color:#fff;border-color:#777}

/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo b{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--a))}
.lang button{padding:6px 12px;font-size:14px;color:var(--muted);border-radius:99px}
.lang button.on{background:var(--ink);color:#fff}

/* nav links */
.links{display:flex;gap:2px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;margin:0 10px}
.links::-webkit-scrollbar{display:none}
.links a{padding:7px 12px;font-size:14px;color:var(--muted);text-decoration:none;border-radius:99px;white-space:nowrap}
.links a:hover,.links a.on{background:#efede8;color:var(--ink)}
.qlink{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));padding:7px 14px;border-radius:99px;margin-right:8px}
.qcta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;padding:22px 24px;border-radius:var(--r);background:linear-gradient(120deg,#ffe9e2,#efe6ff);border:1px solid var(--line)}
.qcta p{margin:0;font-size:15px;max-width:520px}
.qcta a{white-space:nowrap;text-decoration:none;background:var(--ink);color:#fff;font-weight:600;padding:12px 20px;border-radius:99px;font-size:14.5px}
section[id]{scroll-margin-top:58px}
/* hero */
.hero{padding:80px 0 20px;text-align:center}
.orb{width:min(300px,64vw);aspect-ratio:1;margin:0 auto 34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,transparent 40%),conic-gradient(from 90deg,var(--a),var(--b),var(--c),var(--a));box-shadow:0 40px 100px -20px rgba(166,107,255,.55),inset 0 -20px 60px rgba(0,0,0,.12);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) scale(1.02)}}
.hero h1{font-size:clamp(40px,7vw,78px);letter-spacing:-.035em;line-height:1;margin-bottom:18px}
.hero p{color:var(--muted);font-size:19px;max-width:520px;margin:0 auto}

/* cards */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.card h3{font-size:19px;letter-spacing:-.01em;margin-bottom:8px}
.card p,.card li{color:var(--muted);font-size:15px}
.dark{background:var(--dark);color:#fff}
.dark .lead,.dark .kicker{color:#9a9aa3}
.dark .card{background:#141416;border-color:#26262a}
.dark .card p{color:#a5a5ae}

/* safety */
.safety{background:#fff4f2;border:1px solid #ffd3cb;border-radius:var(--r);padding:28px;max-width:640px}
.safety h3{margin-bottom:10px;font-size:21px}
.safety li{margin:7px 0 7px 18px;font-size:15px}
.low{background:#fff;border-radius:18px;padding:20px;border:1px solid #ffd3cb}
.low ol{margin-left:18px;font-size:15px}.low li{margin:6px 0}

/* eating */
.plate{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center}
.pie{width:240px;aspect-ratio:1;border-radius:50%;background:conic-gradient(#3dd6c6 0 50%,#ff7a59 50% 75%,#a66bff 75% 100%);position:relative;margin:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.pie::after{content:"";position:absolute;inset:34%;background:var(--dark);border-radius:50%}
.legend div{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #26262a}
.legend i{width:14px;height:14px;border-radius:50%;margin-top:5px;flex:none}
.legend b{display:block}.legend span{color:#a5a5ae;font-size:14.5px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.macro{background:#141416;border:1px solid #26262a;border-radius:var(--r);padding:20px}
.macro b{font-size:24px;letter-spacing:-.02em;display:block}.macro span{font-size:13px;color:#a5a5ae}

/* meals */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.meal{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;transition:.2s}
.meal:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(0,0,0,.2)}
.meal.sel{border-color:var(--b);background:linear-gradient(#fff,#f6f0ff)}
.meal h4{font-size:16px;margin-bottom:6px}
.meal p{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:600;background:#f1efea;border-radius:99px;padding:3px 10px}
.tags .k{background:#ffe9e2}.tags .p{background:#e1f7f3}
.total{position:sticky;bottom:14px;margin-top:22px;background:var(--ink);color:#fff;border-radius:20px;padding:16px 24px;display:flex;gap:26px;align-items:center;flex-wrap:wrap;box-shadow:0 20px 40px -10px rgba(0,0,0,.4)}
.total div{font-size:13px;color:#a5a5ae}.total b{display:block;font-size:22px;color:#fff;letter-spacing:-.02em}
.total .msg{margin-left:auto;font-size:14px;max-width:260px;color:#fff}

/* training */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.day{flex:1 0 auto;min-width:88px;background:#141416;border:1px solid #26262a;color:#fff;border-radius:16px;padding:12px 16px;font-weight:600;font-size:14px}
.day small{display:block;font-weight:400;color:#8b8b95;font-size:12px}
.day.on{background:#fff;color:var(--ink)}.day.on small{color:var(--muted)}
.panel{background:#141416;border:1px solid #26262a;border-radius:var(--r);padding:26px}
.panel h3{font-size:24px;letter-spacing:-.02em;margin-bottom:4px}
.panel>p{color:#8b8b95;font-size:14px;margin-bottom:14px}
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:13px 0;border-top:1px solid #26262a}
.ex b{font-weight:600}.ex span{color:var(--c);font-weight:600;font-size:14px;text-align:right}.ex em{grid-column:1/-1;color:#8b8b95;font-style:normal;font-size:13.5px}

/* videos */
.vl{color:#fff;font-weight:600;text-align:left;border-bottom:1px dashed #5a5a63;padding:0}
.vl::before{content:"▶";color:var(--c);font-size:11px;margin-right:8px}
.vl:hover{color:var(--c)}
.guide{margin-top:34px}
.guide h3{font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.guide>p{color:#8b8b95;font-size:14px;margin-bottom:14px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vbtn{background:#141416;border:1px solid #26262a;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:500;color:#fff}
.vbtn::before{content:"▶ ";color:var(--c);font-size:11px}
.vbtn:hover{border-color:var(--c)}
#vm{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px}
#vm.on{display:flex}
#vm .box{width:min(860px,100%)}
#vm .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px;gap:16px}
#vm .bar b{font-size:18px}
#vm .bar button{color:#fff;font-size:26px;line-height:1;padding:4px 10px}
#vm .frame{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#vm iframe{width:100%;height:100%;border:0;display:block}
#vm a{display:inline-block;margin-top:10px;color:#a5a5ae;font-size:13.5px}
/* do/dont */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dd .card.do{border-top:4px solid var(--ok)}.dd .card.dont{border-top:4px solid var(--warn)}
.dd ul{padding:0}
.dd li{list-style:none;padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px}
.dd li:last-child{border:0}
.do li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.dont li::before{content:"✕";position:absolute;left:0;color:var(--warn);font-weight:700}

/* tracker */
.row{display:flex;gap:8px;margin:12px 0}
input[type=number]{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);width:100%;background:#fff}
.btn{white-space:nowrap;background:var(--ink);color:#fff;border-radius:12px;padding:0 22px;font-weight:600}
svg.chart{width:100%;height:200px;display:block}
footer{padding:50px 0 70px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer b{display:block;font:400 34px "Instrument Serif",serif;color:var(--ink);margin-bottom:8px}

@media(max-width:860px){
  section{padding:64px 0}
  .macros{grid-template-columns:repeat(2,1fr)}
  .g3,.meals,.dd,.safety,.plate{grid-template-columns:1fr}
  .total .msg{margin-left:0;max-width:none}
  .pie{width:200px}
  .logo span{display:none}
  .links a{padding:7px 9px;font-size:13px}
  .qlink{font-size:13px;padding:6px 11px}
  .vgrid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#hello span{opacity:1;transform:none;filter:none}}
</style>
</head>

const sel={b:null,s:[],l:null,d:null};
let tab='b', dayIdx=Math.max(0,(new Date().getDay()+6)%7);
const START=82, GOAL=62;

/* ================= RENDER ================= */
function render(){
  document.documentElement.lang=lang;
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const head=(o,lead)=>`<div class="kicker">${t(o.k)}</div><h2>${t(o.h)}</h2>${lead?`<p class="lead">${t(o.lead)}</p>`:''}`;
  const M=C.menu,E=C.eat,S=C.safety,P=C.plan,T=C.train,R=C.rules,K=C.track;
  $('#app').innerHTML=`
  <header class="hero"><div class="wrap"><div class="orb"></div><h1>${t(C.hero.h)}</h1><p>${t(C.hero.p)}</p></div></header>

  <section id="plan"><div class="wrap">${head(P,1)}

  <section id="low" style="padding-top:0"><div class="wrap">${head(S)}
    <div class="safety"><div class="low"><h3>${t(S.lowH)}</h3><ol>${t(S.low).map(x=>`<li>${x}</li>`).join('')}</ol><p class="mini" style="margin-top:12px">${t(S.alert)}</p></div></div></div></section>

  <section class="dark" id="eat"><div class="wrap">${head(E,1)}
    <div class="plate"><div class="pie"></div><div class="legend">${E.plate.map(p=>`<div><i style="background:${p[0]}"></i><p><b>${t(p[1])}</b><span>${t(p[2])}</span></p></div>`).join('')}</div></div>
    <div class="macros">${E.macros.map(m=>`<div class="macro"><b>${m[0]}</b><span>${t(m[1])}</span></div>`).join('')}</div>
    <p class="mini" style="margin-top:22px;color:#a5a5ae">${t(E.note)}</p></div></section>

  <section id="meals-s"><div class="wrap">${head(M,1)}
    <div class="chips">${Object.keys(M.cats).map(k=>`<button class="chip ${k===tab?'on':''}" data-tab="${k}">${t(M.cats[k])}</button>`).join('')}</div>
    <div class="meals" id="meals"></div>
    <div class="total"><div>kcal<b id="tK">0</b></div><div>${lang==='fr'?'Protéines':'Protein'}<b id="tP">0 g</b></div><div>${lang==='fr'?'Glucides':'Carbs'}<b id="tC">0 g</b></div><div class="msg" id="tM"></div></div>
    <div class="qcta"><p>${lang==='fr'?'Dis-nous ce que tu aimes et ce que tu ne manges pas, et on prépare un plan encore plus fait pour toi.':'Tell us what you like and what you don\'t eat, and we\'ll build a plan made even more for you.'}</p><a href="form.html">${lang==='fr'?'Remplir le questionnaire →':'Fill in the questionnaire →'}</a></div></div></section>

  <section class="dark" id="train"><div class="wrap">${head(T,1)}
    <div class="grid g3" style="margin-bottom:28px">${T.phases.map(p=>`<div class="card"><h3>${t(p[0])}</h3><p>${t(p[1])}</p></div>`).join('')}</div>
    <div class="days">${T.days.map((d,i)=>`<button class="day ${i===dayIdx?'on':''}" data-day="${i}">${t(d.d)}<small>${t(d.s)}</small></button>`).join('')}</div>

  <section id="rules"><div class="wrap">${head(R)}

    <div class="card dont"><h3>${t(R.nh)}</h3><ul>${t(R.no).map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div></section>

  <section id="track" style="background:#f3f1ec"><div class="wrap">${head(K,1)}

function isSel(k,i){return k==='s'?sel.s.includes(i):sel[k]===i}
function renderMeals(){
  $('#meals').innerHTML=C.menu.items[tab].map((m,i)=>`<button class="meal ${isSel(tab,i)?'sel':''}" data-i="${i}"><h4>${t(m[0])}</h4><p>${t(m[1])}</p><div class="tags"><span class="k">${m[2]} kcal</span><span class="p">${m[3]} g ${lang==='fr'?'prot.':'protein'}</span><span>${m[4]} g ${lang==='fr'?'gluc.':'carbs'}</span></div></button>`).join('');
  $$('.meal').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(tab==='s'){const s=sel.s,j=s.indexOf(i);if(j>-1)s.splice(j,1);else{if(s.length>=2)s.shift();s.push(i)}}
    else sel[tab]=sel[tab]===i?null:i;
    renderMeals()});
  total();
}
function total(){
  let k=0,p=0,c=0,n=0;const I=C.menu.items,add=m=>{k+=m[2];p+=m[3];c+=m[4];n++};
  ['b','l','d'].forEach(s=>{if(sel[s]!==null)add(I[s][sel[s]])});
  sel.s.forEach(i=>add(I.s[i]));
  $('#tK').textContent=k;$('#tP').textContent=p+' g';$('#tC').textContent=c+' g';
  const m=C.menu.msg;$('#tM').textContent=t(n===5?(k<1300?m.low:k>1550?m.high:m.ok):m.none);
}
function renderDay(){
  const d=C.train.days[dayIdx];
  $('#day').innerHTML=`<h3>${t(d.n)}</h3><p>${t(C.train.warm)} ${t(GUIDE.p)}</p>`+d.x.map(x=>`<div class="ex"><b>${VIDEOS[x[0].en]?`<button class="vl" data-v="${x[0].en}">${t(x[0])}</button>`:t(x[0])}</b><span>${typeof x[1]==='string'?x[1]:t(x[1])}</span><em>${t(x[2])}</em></div>`).join('');
  $$('#day .vl').forEach(b=>b.onclick=()=>openVideo(b.dataset.v));
}
function spy(){
  const y=scrollY+120;let cur='';
  NAV.forEach(n=>{const e=document.getElementById(n[0]);if(e&&e.offsetTop<=y)cur=n[0]});
  $$('#links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur));
}
addEventListener('scroll',spy,{passive:true});
function openVideo(k){
  const v=VIDEOS[k];if(!v)return;
  $('#vmT').textContent=t(v[1]);
  $('#vmF').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${v[0]}?rel=0&modestbranding=1" title="${t(v[1])}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $('#vmL').href='https://www.youtube.com/watch?v='+v[0];$('#vmL').textContent=t(GUIDE.yt)+' ↗';
  $('#vm').classList.add('on');
}
function closeVideo(){$('#vm').classList.remove('on');$('#vmF').innerHTML=''}
function drawChart(){
  const w=store.get('weights',[]),svg=$('#chart');
  const pts=[{x:0,y:START},...w.map((v,i)=>({x:i+1,y:v}))];
  const W=500,H=200,pad=24,maxX=Math.max(12,pts.length-1);
  const ys=pts.map(p=>p.y),lo=Math.min(GOAL,...ys)-1,hi=Math.max(START,...ys)+1;
  const X=x=>pad+x/maxX*(W-pad*2),Y=y=>pad+(hi-y)/(hi-lo)*(H-pad*2);
  let g='';
  for(let i=0;i<=12;i+=4)g+=`<text x="${X(i)}" y="${H-4}" font-size="11" fill="#999" text-anchor="middle">${t(C.track.wk)} ${i}</text>`;
  g+=`<line x1="${pad}" x2="${W-pad}" y1="${Y(GOAL)}" y2="${Y(GOAL)}" stroke="#a66bff" stroke-dasharray="4 4" opacity=".6"/><text x="${W-pad}" y="${Y(GOAL)-5}" font-size="11" fill="#a66bff" text-anchor="end">${t(C.track.goal)} ${GOAL} kg</text>`;
  g+=`<path d="M${pts.map(p=>X(p.x)+','+Y(p.y)).join('L')}" fill="none" stroke="#ff7a59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  g+=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="#fff" stroke="#ff7a59" stroke-width="2.5"/>`).join('');
  svg.innerHTML=g;
  const last=w.length?w[w.length-1]:START;
  $('#wInfo').textContent=w.length?(lang==='fr'?`Maintenant ${last} kg · ${(START-last).toFixed(1)} kg en moins · ${(last-GOAL).toFixed(1)} kg avant l'objectif.`:`Now ${last} kg · ${(START-last).toFixed(1)} kg down · ${(last-GOAL).toFixed(1)} kg to go.`):t(C.track.empty);
}

$$('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);render()});
$('#vmX').onclick=closeVideo;
$('#vm').onclick=e=>{if(e.target.id==='vm')closeVideo()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeVideo()});
render();

/* ================= INTRO ================= */
(function(){
  const intro=$('#intro'),wave=$('#wave'),hello=$('#hello');
  for(let i=0;i<41;i++){const b=document.createElement('i');const d=Math.abs(i-20);b.style.setProperty('--h',(18+Math.random()*30+(20-d)*3)+'px');b.style.animationDelay=(i*.045)+'s';b.style.animationDuration=(.9+Math.random()*.7)+'s';wave.appendChild(b)}
  let delay=.35;
  const add=(txt,cls)=>[...txt].forEach(ch=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;if(cls)s.className=cls;s.style.animationDelay=(delay+=.055)+'s';hello.appendChild(s)});
  add('Hello ');add('Oumaima','name');
  let closed=false;
  const close=()=>{if(closed)return;closed=true;intro.classList.add('done');document.body.style.overflow='';setTimeout(()=>intro.remove(),1000)};
  document.body.style.overflow='hidden';
  $('#skip').onclick=close;setTimeout(close,3800);
})();
