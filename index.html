<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oumaima · Programme 12 semaines</title>
<meta name="description" content="Programme sport et alimentation pour Oumaima.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3eee4;--ink:#1c1a17;--mute:#6f685d;--line:#d9d2c3;--acc:#b8412a;--ok:#2f6b4f}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:17px/1.6 Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.serif,h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.01em}
.col{max-width:760px;margin:0 auto;padding:0 22px}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#0b0b0b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#intro.done{opacity:0;visibility:hidden}
#wave{display:flex;align-items:center;gap:4px;height:90px;margin-bottom:30px}
#wave i{width:3px;border-radius:3px;background:#fff;height:6px;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%,100%{height:6px;opacity:.35}50%{height:var(--h);opacity:1}}
#hello{font-size:clamp(46px,10vw,110px);line-height:1;text-align:center;font-family:Fraunces,serif;font-weight:400;letter-spacing:-.03em;padding:0 16px}
#hello span{display:inline-block;opacity:0;transform:translateY(14px);animation:in .7s forwards}
#hello .nm{font-style:italic}
@keyframes in{to{opacity:1;transform:none}}
#skip{position:absolute;bottom:26px;color:#8a8a8a;font-size:14px;border-bottom:1px solid #444}
#skip:hover{color:#fff}

/* top bar */
.top{border-bottom:1px solid var(--line)}
.top .col{display:flex;justify-content:space-between;align-items:center;height:56px}
.top b{font-family:Fraunces,serif;font-weight:600;font-size:18px}
.lang button{padding:4px 8px;font-size:14px;color:var(--mute)}
.lang button.on{color:var(--ink);border-bottom:2px solid var(--acc)}

/* content */
.hero{padding:70px 0 40px}
.hero h1{font-size:clamp(40px,8vw,68px);line-height:1.04;margin-bottom:22px}
.hero h1 em{color:var(--acc)}
.hero p{font-size:19px;color:var(--mute);max-width:560px}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
.facts b{font-weight:600}
section{padding:56px 0 8px;border-top:1px solid var(--line);margin-top:48px}
h2{font-size:clamp(28px,5vw,38px);line-height:1.1;margin-bottom:18px}
h2 .n{display:block;font:500 13px Inter;letter-spacing:.14em;color:var(--acc);margin-bottom:10px}
h3{font-size:21px;margin:26px 0 8px}
p{margin-bottom:14px}.mute{color:var(--mute)}.small{font-size:14.5px}
ul.pl{list-style:none}
ul.pl li{padding:9px 0 9px 22px;position:relative;border-bottom:1px solid var(--line)}
ul.pl li::before{content:"–";position:absolute;left:0;color:var(--acc)}
.note{border-left:3px solid var(--acc);padding:4px 0 4px 18px;margin:22px 0}
.low{background:#e9e1d0;padding:20px 22px;margin:22px 0}
.low ol{margin-left:20px}.low li{margin:5px 0}
dl{margin:10px 0}
dl div{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line)}
dt{color:var(--mute)}dd{font-weight:600;text-align:right}

/* meals */
.tabs{display:flex;flex-wrap:wrap;gap:4px 20px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--ink);border-color:var(--acc)}
.meal{display:grid;grid-template-columns:22px 1fr auto;gap:0 14px;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.meal i{width:18px;height:18px;border:1.5px solid var(--ink);margin-top:4px}
.meal.sel i{background:var(--acc);border-color:var(--acc)}
.meal b{font-weight:600}.meal span{display:block;color:var(--mute);font-size:14.5px}
.meal em{font-style:normal;font-size:13.5px;color:var(--mute);text-align:right;white-space:nowrap}
.total{position:sticky;bottom:0;background:var(--ink);color:var(--paper);padding:14px 20px;margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;font-size:15px}
.total b{font-size:20px;font-family:Fraunces,serif;font-weight:600}
.total .m{width:100%;font-size:14px;color:#cfc8b8}

/* training */
.phase{display:grid;grid-template-columns:110px 1fr;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.phase>b{color:var(--acc);font-weight:600}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0}
.days button{padding:8px 14px;border:1px solid var(--line);font-size:15px;font-weight:500}
.days button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.ex b{font-weight:600}.ex span{color:var(--acc);font-weight:600;font-size:15px;text-align:right}.ex em{grid-column:1/-1;font-style:normal;color:var(--mute);font-size:14.5px}

/* do/dont */
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.two h3{margin-top:0}
.yes li::before{content:"✓"!important;color:var(--ok)!important}.no li::before{content:"✕"!important;color:var(--acc)!important}

/* tracker */
.row{display:flex;gap:8px;margin:12px 0}
input[type=number]{font:inherit;padding:10px 12px;border:1px solid var(--ink);background:transparent;width:140px}
.btn{background:var(--ink);color:var(--paper);padding:10px 18px;font-weight:500}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line);padding:6px 12px;font-size:14px;margin-top:10px}
svg.chart{width:100%;height:190px;display:block;margin:6px 0}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.bar{height:4px;background:var(--line);margin:8px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
footer{margin-top:70px;padding:34px 0 60px;border-top:1px solid var(--line);color:var(--mute);font-size:14.5px}
footer .serif{display:block;font-size:30px;color:var(--ink);margin-bottom:6px}

@media(max-width:640px){.two{grid-template-columns:1fr}.phase{grid-template-columns:1fr}.hero{padding-top:44px}.meal{grid-template-columns:22px 1fr}.meal em{grid-column:2;text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#hello span{opacity:1;transform:none}}
</style>
</head>

 hero:{

  h:L('Le plan','The plan'),
  body:L(
   `<p>La perte de poids se joue dans l'assiette et sur les machines de cardio. La musculation, elle, sert à garder la peau ferme et le corps tonique quand les kilos partent.</p>
    <ul class="pl"><li><b>Manger :</b> un objectif de calories et de protéines par jour, avec plein de repas interchangeables. Tu choisis ce qui te fait envie.</li>
    <li><b>Cardio :</b> marche inclinée, vélo, elliptique et intervalles. C'est le moteur de la perte de graisse.</li>
    <li><b>Musculation :</b> 3 fois par semaine. Le muscle remplit la peau et aide ton corps à mieux utiliser l'insuline.</li></ul>
    <div class="note"><b>Le rythme.</b> Vise une perte régulière d'environ 1 à 1,5 kg par semaine. Plus vite n'est pas mieux : risque d'hypoglycémies, de perte de muscle et de peau relâchée. Pèse-toi une fois par semaine, le même jour, le matin. Si la balance stagne deux semaines, on ajuste un peu la nourriture ou le cardio. Une mauvaise journée ne change rien.</div>`,
   `<p>Weight loss happens in the kitchen and on the cardio machines. Strength training keeps your skin firm and your body toned as the weight comes off.</p>
    <ul class="pl"><li><b>Eating:</b> a daily calorie and protein target, with plenty of interchangeable meals. You pick what you feel like.</li>
    <li><b>Cardio:</b> incline walking, bike, elliptical and intervals. It's the engine of fat loss.</li>
    <li><b>Strength:</b> 3 times a week. Muscle fills out the skin and helps your body use insulin better.</li></ul>
    <div class="note"><b>The pace.</b> Aim for a steady loss of about 1–1.5 kg a week. Faster isn't better: it risks lows, muscle loss and loose skin. Weigh yourself once a week, same day, in the morning. If the scale stalls for two weeks, we tweak food or cardio slightly. One bad day changes nothing.</div>`)
 },
 safety:{
  h:L('Sécurité : diabète d\'abord','Safety: diabetes first'),
  body:L(
   `<ul class="pl">
    <li><b>Parle de ce plan à ton médecin.</b> En perdant du poids, tes besoins en médicaments ou insuline peuvent baisser. Ne change jamais une dose toute seule.</li>
    <li><b>Mesure ta glycémie</b> avant et après chaque séance, et pendant les séances de plus d'une heure.</li>
    <li><b>Pour commencer une séance :</b> glycémie entre 1,00 et 2,50 g/L (5,6–13,9 mmol/L). En dessous de 1,00, mange d'abord 15 g de glucides. Au-dessus de 2,50 avec symptômes ou cétones, ne fais pas de sport.</li>
    <li><b>Ne saute jamais de repas</b> pour économiser des calories. Des repas réguliers, c'est une glycémie stable.</li>
    <li>Regarde tes pieds chaque jour, porte de bonnes chaussures, garde de l'eau près de toi.</li>
    <li>Aie toujours du sucre rapide et ton téléphone sur toi. Préviens la salle ou une amie que tu es diabétique.</li></ul>
    <div class="low"><h3 style="margin-top:0">Si tu fais une hypoglycémie (tremblements, sueurs, vertiges, faim)</h3>
    <ol><li>Arrête tout de suite et assieds-toi.</li><li>Prends <b>15 g de sucre rapide</b> : 3–4 comprimés de glucose, ½ verre de jus, ou 1 c. à s. de miel.</li><li>Attends <b>15 minutes</b> et recontrôle.</li><li>Toujours sous 0,70 g/L (3,9 mmol/L) ? Recommence.</li><li>Quand c'est revenu à la normale, mange une petite collation avec des protéines. Pas de reprise de la séance.</li></ol>
    <p class="small" style="margin:10px 0 0">Symptômes sévères, confusion ou malaise : appelle les secours.</p></div>`,
   `<ul class="pl">
    <li><b>Tell your doctor about this plan.</b> As you lose weight, your medication or insulin needs may drop. Never change a dose on your own.</li>
    <li><b>Check your glucose</b> before and after every workout, and during sessions over an hour.</li>
    <li><b>To start a workout:</b> glucose around 100–250 mg/dL (5.6–13.9 mmol/L). Under 100, eat 15 g of carbs first. Over 250 with symptoms or ketones, skip it.</li>
    <li><b>Never skip meals</b> to save calories. Regular meals mean steady sugar.</li>
    <li>Check your feet daily, wear proper shoes, keep water close.</li>
    <li>Always carry fast sugar and your phone. Tell the gym or a friend you're diabetic.</li></ul>
    <div class="low"><h3 style="margin-top:0">If you go low (shaky, sweaty, dizzy, hungry)</h3>
    <ol><li>Stop right away and sit down.</li><li>Take <b>15 g fast sugar</b>: 3–4 glucose tablets, ½ cup juice, or 1 tbsp honey.</li><li>Wait <b>15 minutes</b> and recheck.</li><li>Still under 70 mg/dL (3.9 mmol/L)? Repeat.</li><li>Once normal, eat a small snack with protein. Don't resume the workout.</li></ol>
    <p class="small" style="margin:10px 0 0">Severe symptoms, confusion or fainting: call emergency services.</p></div>`)
 },

  intro:L('Pas besoin de tout compter. Compose ton assiette de la même façon, atteins tes protéines, et pioche dans les repas plus bas.',
          'No need to count everything. Build your plate the same way every time, hit your protein, and pick from the meals below.'),

  rules:L(
   `<ul class="pl"><li><b>5 petits repas :</b> petit-déjeuner, collation, déjeuner, collation, dîner, toutes les 3–4 heures.</li><li><b>Jamais de glucides seuls :</b> associe-les à des protéines ou des fibres pour ralentir la montée du sucre.</li><li><b>Dîner avant 20 h,</b> 2–3 heures avant le coucher.</li><li><b>Cuisson :</b> grillé, four, vapeur ou air fryer. Max 1 c. à s. d'huile d'olive par repas.</li><li><b>À volonté :</b> eau, thé non sucré, café noir, concombre, salade, herbes, épices, citron, bouillon clair.</li></ul>`,

   {d:L('Jeu','Thu'),n:L('Cardio intervalles · 40 min','Interval cardio · 40 min'),x:[

    [L('Intervalles (vélo ou elliptique)','Intervals (bike or elliptical)'),L('8 × (1 min dur + 2 min facile)','8 × (1 min hard + 2 min easy)'),L('Sem. 1–4 : 5 rounds de 30 s dur + 90 s facile. « Dur » = essoufflée mais maîtrisée.','Weeks 1–4: 5 rounds of 30 s hard + 90 s easy. "Hard" = breathless but in control.')],

   {d:L('Ven','Fri'),n:L('Muscu C · corps entier · 45 min','Strength C · full body · 45 min'),x:[
    [L('Montées sur banc','Step-ups'),L('3 × 10 par jambe','3 × 10 per leg'),L('Le genou suit la pointe du pied.','Knee tracks over the toes.')],
    [L('Développé incliné (haltères)','Incline dumbbell press'),'3 × 10–12',L('Banc à 30°.','Bench at 30°.')],
    [L('Rowing un bras','One-arm dumbbell row'),L('3 × 12 par côté','3 × 12 per side'),L('Dos plat, coude vers la hanche.','Back flat, elbow to hip.')],
    [L('Soulevé de terre kettlebell','Kettlebell deadlift'),'3 × 12',L('Hanches vers l\'arrière, serre les fessiers.','Hips back, squeeze the glutes.')],
    [L('Élévations latérales','Lateral raise'),'2–3 × 12–15',L('Très léger. Les coudes mènent.','Very light. Lead with the elbows.')],
    [L('Pallof press','Pallof press'),L('3 × 10 par côté','3 × 10 per side'),L('Résiste à la rotation, abdos serrés.','Resist rotation, core tight.')],

   {d:L('Sam','Sat'),n:L('Long cardio · 60–75 min','Long cardio · 60–75 min'),x:[
    [L('Au choix ou mélange','Pick one or mix'),'60–75 min',L('Marche inclinée, vélo, elliptique ou escalier à allure régulière. Sem. 1–4 : monte progressivement depuis 45 min.','Incline walk, bike, elliptical or stair-climber at a steady pace. Weeks 1–4: build up from 45 min.')],
    [L('Glycémie et eau','Glucose and water'),'—',L('Contrôle toutes les 30–40 min. Garde du sucre rapide sur toi.','Check every 30–40 min. Keep fast sugar on you.')],

   {d:L('Dim','Sun'),n:L('Récupération active · 30–40 min','Active recovery · 30–40 min'),x:[
    [L('Marche tranquille dehors','Easy walk outside'),'30–40 min',L('Grand air, sans pression.','Fresh air, no pressure.')],
    [L('Mobilité ou yoga doux','Mobility or gentle yoga'),'10–15 min',L('Hanches, épaules, colonne.','Hips, shoulders, spine.')],

  ]
 },
 rules:{
  h:L('À faire, à éviter','Do and don\'t'),
  yes:L(['Mesurer ta glycémie avant et après le sport','Manger des protéines à chaque repas et collation','Boire 2,5 L d\'eau par jour','Marcher 10 minutes après les repas','T\'échauffer 5–10 min et t\'étirer à la fin','Soulever lentement, amplitude complète','Dormir 7–8 heures','Préparer tes repas le dimanche','Prendre une photo tous les 15 jours','Signaler à ton médecin les hypos ou hypers répétées'],
        ['Check glucose before and after training','Eat protein at every meal and snack','Drink 2.5 L of water a day','Walk 10 minutes after meals','Warm up 5–10 min and stretch afterwards','Lift slowly, full range of motion','Sleep 7–8 hours','Prep your meals on Sunday','Take a photo every two weeks','Tell your doctor about repeated lows or highs']),
  no:L(['Sauter des repas ou te priver','T\'entraîner avec une glycémie basse ou à jeun','Boire jus, sodas ou boissons sucrées (sauf pour corriger une hypo)','Acheter des produits « light » pleins de sucres cachés','Changer ton traitement ou ton insuline seule','Faire uniquement du cardio : la muscu n\'est pas optionnelle','Te peser tous les jours et paniquer','Prendre laxatifs, diurétiques ou brûleurs de graisse','T\'entraîner malgré douleur thoracique, vertiges ou blessure au pied','Te comparer aux autres'],
       ['Skip meals or starve yourself','Train on low glucose or an empty stomach','Drink juice, soda or sweet drinks (except to treat a low)','Buy "light" foods full of hidden sugar','Change your medication or insulin on your own','Do only cardio: strength is not optional','Weigh yourself daily and panic','Use laxatives, diuretics or fat-burner pills','Train through chest pain, dizziness or a foot injury','Compare yourself to others'])
 },
 track:{
  h:L('Suivi','Tracking'),
  intro:L('Enregistré uniquement sur cet appareil.','Saved on this device only.'),
  weigh:L('Pesée hebdomadaire (kg)','Weekly weigh-in (kg)'),
  add:L('Ajouter','Add'),reset:L('Réinitialiser','Reset'),confirm:L('Effacer toutes les pesées ?','Reset all weigh-ins?'),
  empty:L('Poids de départ : 82 kg. Ajoute ta première pesée.','Start weight: 82 kg. Add your first weigh-in.'),
  goal:L('objectif','goal'),wk:L('sem.','wk'),
  habits:L('Habitudes de la semaine','This week\'s habits'),newWeek:L('Nouvelle semaine','New week'),
  hab:L(['Protéines atteintes 6 jours sur 7','3 séances de musculation','3 séances de cardio','10 000 pas la plupart des jours','2,5 L d\'eau par jour','Glycémie contrôlée autour des séances','7 h de sommeil ou plus','Pesée de la semaine enregistrée'],
        ['Protein target hit 6 days out of 7','3 strength sessions','3 cardio sessions','10,000 steps most days','2.5 L of water a day','Glucose checked around workouts','7+ hours of sleep','Weekly weigh-in logged'])
 },
 foot:{big:L('Tu vas y arriver, Oumaima.','You\'ve got this, Oumaima.'),small:L('Ce programme est un guide général, pas un avis médical. Garde ton médecin dans la boucle.','This program is general guidance, not medical advice. Keep your doctor in the loop.')}
};

/* ================= STATE ================= */
const sel={b:null,s:[],l:null,d:null};
let tab='b', dayIdx=Math.max(0,(new Date().getDay()+6)%7);
const START=82, GOAL=62;

/* ================= RENDER ================= */
function render(){
  document.documentElement.lang=lang;
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  const H=(n,txt)=>`<h2><span class="n">0${n}</span>${t(txt)}</h2>`;
  const M=C.menu;
  $('#app').innerHTML=`
  <div class="hero"><h1>${t(C.hero.h)}</h1><p>${t(C.hero.p)}</p>
    <div class="facts">${C.hero.facts.map(f=>`<span><b>${t(f[0])}</b> ${t(f[1])}</span>`).join('')}</div></div>

  <section id="plan">${H(1,C.plan.h)}${t(C.plan.body)}</section>
  <section id="safety">${H(2,C.safety.h)}${t(C.safety.body)}</section>

  <section id="eat">${H(3,C.eat.h)}<p class="mute">${t(C.eat.intro)}</p>
    ${C.eat.plate.map(r=>`<div class="phase"><b>${t(r[0])}</b><div><b>${t(r[1])}</b><br><span class="mute">${t(r[2])}</span></div></div>`).join('')}
    <h3>${lang==='fr'?'Tes objectifs du jour':'Your daily targets'}</h3>
    <dl>${C.eat.targets.map(r=>`<div><dt>${t(r[0])}</dt><dd>${t(r[1])}</dd></div>`).join('')}</dl>
    ${t(C.eat.rules)}</section>

  <section id="menu">${H(4,M.h)}<p class="mute">${t(M.intro)}</p>
    <div class="tabs">${Object.keys(M.cats).map(k=>`<button data-tab="${k}" class="${k===tab?'on':''}">${t(M.cats[k])}</button>`).join('')}</div>
    <div id="meals"></div>
    <div class="total"><span><b id="tK">0</b> kcal</span><span><b id="tP">0</b> ${lang==='fr'?'g protéines':'g protein'}</span><span><b id="tC">0</b> ${lang==='fr'?'g glucides':'g carbs'}</span><span class="m" id="tM"></span></div>
  </section>

  <section id="train">${H(5,C.train.h)}<p class="mute">${t(C.train.intro)}</p>
    ${C.train.phases.map(p=>`<div class="phase"><b>${t(p[0])}</b><div>${t(p[1])}</div></div>`).join('')}
    <div class="days">${C.train.days.map((d,i)=>`<button data-day="${i}" class="${i===dayIdx?'on':''}">${t(d.d)}</button>`).join('')}</div>
    <div id="day"></div>
    <div style="margin-top:26px">${t(C.train.after)}</div></section>

  <section id="rules">${H(6,C.rules.h)}
    <div class="two"><div><h3>${lang==='fr'?'À faire':'Do'}</h3><ul class="pl yes">${t(C.rules.yes).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div><h3>${lang==='fr'?'À éviter':'Don\'t'}</h3><ul class="pl no">${t(C.rules.no).map(x=>`<li>${x}</li>`).join('')}</ul></div></div></section>

  <section id="track">${H(7,C.track.h)}<p class="mute">${t(C.track.intro)}</p>
    <h3>${t(C.track.weigh)}</h3>
    <div class="row"><input id="wIn" type="number" step="0.1" placeholder="80.4"><button class="btn" id="wAdd">${t(C.track.add)}</button></div>
    <svg class="chart" id="chart" viewBox="0 0 500 190" preserveAspectRatio="none"></svg>
    <p class="small mute" id="wInfo"></p><button class="btn ghost" id="wClear">${t(C.track.reset)}</button>
    <h3>${t(C.track.habits)}</h3><div class="bar"><i id="cBar"></i></div><div id="checks"></div>
    <button class="btn ghost" id="cClear">${t(C.track.newWeek)}</button></section>

  <footer><span class="serif">${t(C.foot.big)}</span>${t(C.foot.small)}</footer>`;

  $$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderMeals();$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b))});
  $$('[data-day]').forEach(b=>b.onclick=()=>{dayIdx=+b.dataset.day;renderDay();$$('[data-day]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#wAdd').onclick=()=>{const v=parseFloat($('#wIn').value);if(!(v>30&&v<200))return;const w=store.get('weights',[]);w.push(v);store.set('weights',w);$('#wIn').value='';drawChart()};
  $('#wClear').onclick=()=>{if(confirm(t(C.track.confirm))){store.set('weights',[]);drawChart()}};
  $('#cClear').onclick=()=>{store.set('habits',[]);renderChecks()};
  renderMeals();renderDay();drawChart();renderChecks();
}

function isSel(k,i){return k==='s'?sel.s.includes(i):sel[k]===i}
function renderMeals(){
  const items=C.menu.items[tab];
  $('#meals').innerHTML=items.map((m,i)=>`<button class="meal ${isSel(tab,i)?'sel':''}" data-i="${i}"><i></i><div><b>${t(m[0])}</b><span>${t(m[1])}</span></div><em>${m[2]} kcal<br>${m[3]} g P · ${m[4]} g ${lang==='fr'?'G':'C'}</em></button>`).join('');
  $$('.meal').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(tab==='s'){const s=sel.s,j=s.indexOf(i);if(j>-1)s.splice(j,1);else{if(s.length>=2)s.shift();s.push(i)}}
    else sel[tab]=sel[tab]===i?null:i;
    renderMeals()});
  total();
}
function total(){
  let k=0,p=0,c=0,n=0;const I=C.menu.items;
  const add=m=>{k+=m[2];p+=m[3];c+=m[4];n++};
  ['b','l','d'].forEach(s=>{if(sel[s]!==null)add(I[s][sel[s]])});
  sel.s.forEach(i=>add(I.s[i]));
  $('#tK').textContent=k;$('#tP').textContent=p;$('#tC').textContent=c;
  const m=C.menu.msg;
  $('#tM').textContent=t(n===5?(k<1300?m.low:k>1550?m.high:m.ok):m.none);
}
function renderDay(){
  const d=C.train.days[dayIdx];
  $('#day').innerHTML=`<h3>${t(d.n)}</h3><p class="small mute">${t(C.train.warm)}</p>`+d.x.map(x=>`<div class="ex"><b>${t(x[0])}</b><span>${typeof x[1]==='string'?x[1]:t(x[1])}</span><em>${t(x[2])}</em></div>`).join('');
}
function drawChart(){
  const w=store.get('weights',[]),svg=$('#chart');
  const pts=[{x:0,y:START},...w.map((v,i)=>({x:i+1,y:v}))];
  const W=500,H=190,pad=24,maxX=Math.max(12,pts.length-1);
  const ys=pts.map(p=>p.y),lo=Math.min(GOAL,...ys)-1,hi=Math.max(START,...ys)+1;
  const X=x=>pad+x/maxX*(W-pad*2),Y=y=>pad+(hi-y)/(hi-lo)*(H-pad*2);
  let g='';
  for(let i=0;i<=12;i+=4)g+=`<text x="${X(i)}" y="${H-4}" font-size="11" fill="#6f685d" text-anchor="middle">${t(C.track.wk)} ${i}</text>`;
  g+=`<line x1="${pad}" x2="${W-pad}" y1="${Y(GOAL)}" y2="${Y(GOAL)}" stroke="#1c1a17" stroke-dasharray="3 5" opacity=".5"/><text x="${W-pad}" y="${Y(GOAL)-5}" font-size="11" fill="#1c1a17" text-anchor="end">${t(C.track.goal)} ${GOAL} kg</text>`;
  g+=`<path d="M${pts.map(p=>X(p.x)+','+Y(p.y)).join('L')}" fill="none" stroke="#b8412a" stroke-width="2.5"/>`;
  g+=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="#f3eee4" stroke="#b8412a" stroke-width="2"/>`).join('');
  svg.innerHTML=g;
  const last=w.length?w[w.length-1]:START;
  $('#wInfo').textContent=w.length?(lang==='fr'?`Maintenant ${last} kg · ${(START-last).toFixed(1)} kg en moins · ${(last-GOAL).toFixed(1)} kg avant l'objectif.`:`Now ${last} kg · ${(START-last).toFixed(1)} kg down · ${(last-GOAL).toFixed(1)} kg to go.`):t(C.track.empty);
}
function renderChecks(){
  const s=store.get('habits',[]);
  $('#checks').innerHTML=t(C.track.hab).map((h,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${s.includes(i)?'checked':''}> ${h}</label>`).join('');
  $$('#checks input').forEach(c=>c.onchange=()=>{const cur=store.get('habits',[]),i=+c.dataset.i;store.set('habits',c.checked?[...cur,i]:cur.filter(x=>x!==i));bar()});
  bar();
}
function bar(){$('#cBar').style.width=(store.get('habits',[]).length/C.track.hab.fr.length*100)+'%'}

$$('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('lang',lang);render()});
render();

/* ================= INTRO ================= */
(function(){
  const intro=$('#intro'),wave=$('#wave'),hello=$('#hello');
  for(let i=0;i<47;i++){const b=document.createElement('i');const d=Math.abs(i-23);b.style.setProperty('--h',(14+Math.random()*26+(23-d)*1.6)+'px');b.style.animationDelay=(i*.04)+'s';b.style.animationDuration=(.8+Math.random()*.7)+'s';wave.appendChild(b)}
  let delay=.3;
  const add=(txt,cls)=>[...txt].forEach(ch=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;if(cls)s.className=cls;s.style.animationDelay=(delay+=.06)+'s';hello.appendChild(s)});
  add('Hello ');add('Oumaima','nm');
  let closed=false;
  const close=()=>{if(closed)return;closed=true;intro.classList.add('done');document.body.style.overflow='';setTimeout(()=>intro.remove(),900)};
  document.body.style.overflow='hidden';
  $('#skip').onclick=close;setTimeout(close,3600);
})();
</script>
